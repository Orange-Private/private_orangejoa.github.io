name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  pull-requests: write
  contents: read
jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get diff
        run: |
          git fetch origin ${{ github.base_ref }} 2>/dev/null || true
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/diff.txt 2>/dev/null || git diff HEAD~1 HEAD > /tmp/diff.txt 2>/dev/null || true
          echo "diff_lines=$(wc -l < /tmp/diff.txt)" >> $GITHUB_ENV
      - name: AI Code Review
        if: env.diff_lines != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, subprocess, sys
          with open("/tmp/diff.txt", "r", errors="replace") as f:
              diff = f.read(18000)
          if not diff.strip():
              sys.exit(0)
          prompt = ("다음 코드 변경사항을 검토하고 아래 형식으로 한국어로 작성해주세요.\n\n"
                    "## 변경 요약\n변경사항을 2-3줄로 요약\n\n"
                    "## 이슈 및 위험 요소\n- 버그 가능성, 보안 취약점, 예외 처리 누락, 성능 문제 등\n- 없으면 '없음'\n\n"
                    "## 개선 제안\n- 코드 품질, 가독성, 유지보수성 관련 제안\n- 없으면 '없음'\n\n"
                    "## 전반적 평가\n한 줄 평가\n\n---\ndiff:\n" + diff)
          payload = json.dumps({"model": "claude-haiku-4-5-20251001", "max_tokens": 2000,
              "messages": [{"role": "user", "content": prompt}]}).encode()
          req = urllib.request.Request("https://api.anthropic.com/v1/messages", data=payload,
              headers={"x-api-key": os.environ["ANTHROPIC_API_KEY"],
                       "anthropic-version": "2023-06-01", "content-type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  data = json.loads(res.read())
              review = data["content"][0]["text"]
          except Exception as e:
              review = f"리뷰 생성 오류: {e}"
          body = f"## AI Code Review\n\n{review}\n\n---\n*Powered by Claude AI*"
          subprocess.run(["gh", "pr", "comment", os.environ["PR_NUMBER"],
              "--repo", os.environ["REPO"], "--body", body], check=False)
          EOF
